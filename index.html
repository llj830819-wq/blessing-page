<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>潮流神聖加持・尾牙中獎 +1</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: radial-gradient(circle at top, #ffdd66 0%, #ff9933 30%, #1b1b1b 80%);
    color: #fff;
    overflow-x: hidden;
  }
  .bg-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 0%, rgba(255,255,255,0.18) 0, transparent 55%),
      radial-gradient(circle at 80% 100%, rgba(255,200,0,0.25) 0, transparent 60%);
    mix-blend-mode: screen;
    opacity: 0.9;
  }
  .container {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 40px;
    text-align: center;
  }
  .title {
    font-size: 32px;
    letter-spacing: 4px;
    font-weight: 900;
    text-shadow: 0 0 12px rgba(0,0,0,0.6);
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 16px;
    opacity: 0.9;
    margin-bottom: 24px;
  }
  .poster-wrap {
    position: relative;
    max-width: 420px;
    width: 100%;
    margin: 0 auto 24px;
    padding: 12px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.02));
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
  }
  .poster-inner {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: #f5a33a;
  }
  .poster-inner img {
    display: block;
    width: 100%;
    height: auto;
  }
  .halo-ring {
    position: absolute;
    inset: -10%;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.18);
    pointer-events: none;
    animation: spin 18s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .btn {
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #1b1b1b;
    background: linear-gradient(135deg, #ffe066, #ffb347);
    box-shadow: 0 8px 18px rgba(0,0,0,0.45);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }
  .btn:hover {
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 10px 22px rgba(0,0,0,0.6);
    filter: brightness(1.05);
  }
  .btn:active {
    transform: translateY(1px) scale(0.98);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .btn-secondary {
    background: rgba(0,0,0,0.55);
    color: #ffe9a6;
    box-shadow: 0 6px 14px rgba(0,0,0,0.6);
  }
  .hint {
    font-size: 13px;
    opacity: 0.8;
  }
  .footer {
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.75;
  }
  .floating-plus {
    position: fixed;
    font-weight: 900;
    color: #fffbcc;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    pointer-events: none;
    animation: floatUp 1.1s ease-out forwards;
    z-index: 50;
  }
  @keyframes floatUp {
    0% {
      opacity: 0;
      transform: translateY(10px) scale(0.8);
    }
    20% {
      opacity: 1;
      transform: translateY(-4px) scale(1);
    }
    100% {
      opacity: 0;
      transform: translateY(-60px) scale(1.1);
    }
  }
  .yt-wrapper {
    position: fixed;
    width: 0;
    height: 0;
    overflow: hidden;
  }
  @media (min-width: 768px) {
    .title {
      font-size: 40px;
    }
    .subtitle {
      font-size: 18px;
    }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="container">
  <div class="title">潮流神聖加持・尾牙中獎 +1</div>
  <div class="subtitle">耶穌・媽祖・如來佛祖・摩訶婆羅多 聯合加持，祝你今晚抽獎手氣爆棚</div>

  <div class="poster-wrap">
    <div class="poster-inner">
      <!-- 這裡換成你的海報圖片網址 -->
      <img src="https://github.com/llj830819-wq/blessing-page/blob/main/A%20trendy%20divine-bles.png?raw=true" alt="潮流神聖加持海報">
      <div class="halo-ring"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="musicToggle">
      🎵 播放神聖潮流 BGM
    </button>
    <button class="btn btn-secondary" id="plusOneBtn">
      ✨ 我今晚一定中獎 +1
    </button>
    <div class="hint">提示：有些裝置會要求你先點擊按鈕，音樂才會播放。</div>
  </div>

  <div class="footer">
    © 2026 潮流神聖加持系統｜祝你中獎 +1
  </div>
</div>

<!-- YouTube 音樂（隱藏播放器） -->
<div class="yt-wrapper">
  <div id="player"></div>
</div>

<script>
  // YouTube IFrame API 載入
  let tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  let firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  let player;
  let isPlaying = false;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '0',
      width: '0',
      videoId: 'WAXR5wdlBnQ', // 你的音樂影片 ID
      playerVars: {
        'playsinline': 1
      },
      events: {
        'onReady': onPlayerReady
      }
    });
  }

  function onPlayerReady() {
    const btn = document.getElementById('musicToggle');
    btn.addEventListener('click', function () {
      if (!player) return;
      if (!isPlaying) {
        player.playVideo();
        isPlaying = true;
        btn.textContent = '⏸ 暫停神聖潮流 BGM';
      } else {
        player.pauseVideo();
        isPlaying = false;
        btn.textContent = '🎵 播放神聖潮流 BGM';
      }
    });
  }

  // 中獎 +1 飄字效果
  const plusBtn = document.getElementById('plusOneBtn');
  plusBtn.addEventListener('click', function (e) {
    const plus = document.createElement('div');
    plus.className = 'floating-plus';
    plus.textContent = '+1 中獎加持';
    const x = e.clientX || (window.innerWidth / 2);
    const y = e.clientY || (window.innerHeight / 2);
    plus.style.left = (x - 40) + 'px';
    plus.style.top = (y - 10) + 'px';
    document.body.appendChild(plus);
    setTimeout(() => plus.remove(), 1100);
  });
</script>
</body>

</html>
